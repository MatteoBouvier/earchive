[workspace]
resolver = "3"
members = ["cli", "crates/*", "desktop"]
default-members = ["desktop/"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = {
  git = "https://github.com/zed-industries/zed",
  features = ["font-kit", "wayland", "x11"]
}
